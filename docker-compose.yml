version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: resqsphere_db
    environment:
      POSTGRES_USER: resqsphere_admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: resqsphere
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgis_data: